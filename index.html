<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link href="style1.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" href="https://t3.ftcdn.net/jpg/16/79/77/82/360_F_1679778281_r8aGpq8Q51Ykq5bTwHosQ1AOdU8FqjIN.jpg" type="image/x-icon">
  </head>
  <body>
    <div class="container">

      <h2>Currency Converter</h2>

      <form>

        <div class="amount">
          <p>Enter Amount</p>
          <input value="1" type="text" />
        </div>


        <div class="dropdown">

          <div class="from">
            <p>From</p>
            <div class="select-container">
              <img src="https://flagsapi.com/US/flat/64.png" />
              <select name="from"></select>
            </div>
          </div>

          <i class="fa-solid fa-arrow-right-arrow-left swap"></i>

          <div class="to">
            <p>To</p>
            <div class="select-container">

              <img src="https://flagsapi.com/IN/flat/64.png" />

              <select name="to"></select>
            </div>
          </div>

        </div>


        <div class="msg">1USD = 80INR</div>
        <button class="btnnn">Get Exchange Rate</button>
      </form>
    </div>

      <audio id="clickAudio" preload="auto">
  <source src="https://www.orangefreesounds.com/wp-content/uploads/2017/01/Button-click-sound.mp3" type="audio/mpeg">
</audio>

<audio id="popUp" preload="auto">
  <source src="https://orangefreesounds.com/wp-content/uploads/2025/12/Popup-sound-effect.mp3" type="audio/mpeg">
</audio>



    <script src="codes.js"></script>
    <script src="convertor.js"></script>
  </body>
</html>
